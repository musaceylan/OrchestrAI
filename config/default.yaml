# OrchestrAI Default Configuration
# Override any value via environment variable: ORCHESTRAI__SECTION__KEY=value
# Precedence (highest first): ORCHESTRAI__ overrides, provider environment
# (including ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY),
# ORCHESTRAI__ overrides from dotenv, YAML, typed defaults.
# Explicit config paths must exist and validate.
# YAML: at most 1 MiB, 32 levels, 10,000 nodes; no aliases or duplicate keys.

server:
  name: orchestrai
  transport: stdio
  version: "0.1.0"

anthropic:
  default_model: claude-sonnet-4-6

openai:
  default_model: gpt-4.1

gemini:
  default_model: gemini-2.5-pro-preview-05-06

# Local model endpoints (Ollama, vLLM, LM Studio, etc.)
local_providers: []
# Example:
# local_providers:
#   - name: ollama-local
#     base_url: http://localhost:11434
#   - name: vllm-gpu
#     base_url: http://localhost:8000

orchestrator:
  timeout_budget_sec: 300        # 5 minutes max per task
  max_parallel_agents: 3         # max parallel agents
  default_mode: planner_coder_reviewer

policy:
  # privacy_level: public | internal | confidential | secret
  privacy_level: public
  # Provider allowlist/denylist (empty = no restriction)
  allowed_providers: []
  denied_providers: []

observability:
  log_level: INFO
  log_format: json         # json | console
  trace_dir: /tmp/orchestrai/traces
  artifact_dir: /tmp/orchestrai/artifacts
