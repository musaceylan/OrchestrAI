# OrchestrAI Default Configuration
# Override any value via environment variable: ORCHESTRAI__SECTION__KEY=value

server:
  name: orchestrai
  transport: stdio
  version: "0.1.0"

anthropic:
  api_key: ""          # Set via ANTHROPIC_API_KEY env var
  default_model: claude-sonnet-4-6
  max_retries: 3

openai:
  api_key: ""          # Set via OPENAI_API_KEY env var
  default_model: gpt-4.1
  max_retries: 3

gemini:
  api_key: ""          # Set via GEMINI_API_KEY env var
  default_model: gemini-2.5-pro-preview-05-06

# Local model endpoints (Ollama, vLLM, LM Studio, etc.)
local_providers: []
# Example:
# local_providers:
#   - name: ollama-local
#     base_url: http://localhost:11434
#   - name: vllm-gpu
#     base_url: http://localhost:8000

orchestrator:
  timeout_budget_sec: 300        # 5 minutes max per task
  max_parallel_drafts: 3         # max parallel CODER calls in parallel_draft mode
  default_mode: planner_coder_reviewer

policy:
  # privacy_level: public | internal | private | secret
  default_privacy_level: internal
  # cost_tier: free | low | medium | high | very_high
  default_cost_tier: high
  # Provider allowlist/denylist (empty = no restriction)
  allowed_providers: []
  denied_providers: []
  # Prefer diversity: avoid assigning same provider to multiple roles
  prefer_provider_diversity: true

observability:
  log_level: INFO
  log_format: json         # json | console
  trace_dir: /tmp/orchestrai/traces
  artifact_dir: /tmp/orchestrai/artifacts
